<!-- Javascript -->
<script src="resources/@jambonz/node-red-contrib-jambonz/speech-schema.js"></script>
<script src="resources/@jambonz/node-red-contrib-jambonz/speech-component.js"></script>
<script type="text/javascript">
  var mustacheType = {
    value: 'mustache',
    label: 'mustache',
    hasvalue: true,
    icon: 'resources/@jambonz/node-red-contrib-jambonz/icons/mustache.svg'
  }
  RED.nodes.registerType('gather',{
      category: 'jambonz',
      color: '#bbabaa',
      defaults: {
        name: {value: ''},
        saySynth: {value: ''},
        recognizer: {value: ''},
        speechServer: {value: '', type: 'jambonz_auth', required: false},
        speechMigrated: {value: ''},
        actionhook: {value: ''},
        actionhookType: {val: 'str'},
        partialresulthook: {value: ''},
        partialresulthookType: {val: 'str'},
        finishonkey: {value: ''},
        dtmfinput: {value: 0},
        speechinput: {value: 1},
        numdigits: {value: ''},
        mindigits: {value: ''},
        maxdigits: {value: ''},
        interdigittimeout: {value: ''},
        timeout: {value: ''},
        bargein: {value: true},
        dtmfbargein: {value: true},
        listenduringprompt: {value: true},
        prompttype: {value: 'say'},
        playurl: {value: ''},
        playurlType: {value: 'str'},
        playLoop: {value: ''},
        text: {value: ''},
        vendor: {value: 'default'},
        lang: {value: 'default'},
        voice: {value: 'default'},
        xvoice: {},
        xlang: {},
        transcriptionvendor: {value: 'default'},
        recognizerlang: {value: 'default'},
        recognizeraltlang: {},
        recognizeraltlangType: {val: 'str'},
        interim: {value: false},
        profanityfilter: {value: false},
        transcriptionhints: {},
        transcriptionhintsType: {val: 'str'},
        separaterecog: {value: false},
        useenhanced: {value: false},
        words: {value: false},
        punctuation: {value: false},
        diarization: {value: false},
        diarizationmin: {value: 2},
        diarizationminType: {value: 'num'},
        diarizationmax: {value: 6},
        diarizationmaxType: {value: 'num'},
        interactiontype: {value: 'voice_command'},
        naics: {value: 0},
        naicsType: {value: 'num'},
        identifychannels: {value: false},
        speakerlabel: {value: false},
        vocabularyname: {},
        vocabularynameType: {value: 'str'},
        vocabularyfiltername: {},
        vocabularyfilternameType: {value: 'str'},
        vocabularyfiltermethod: {},
        speechTimeout: {value: ''},
        minBargeinWordCount: {value: ''},
        asrTimeout: {value: ''},
        fastRecognitionTimeout: {value: ''},
        asrDtmfTerminationDigit: {value: ''},
        fillerNoise: {value: ''},
        fillerNoiseType: {value: 'json'},
        vad: {value: ''},
        vadType: {value: 'json'},
        actionHookDelayAction: {value: ''},
        actionHookDelayActionType: {value: 'json'}
      },
      inputs:1,
      outputs:1,
      icon: "font-awesome/fa-microphone",
      label: function() { return this.name || 'gather';},
      oneditprepare: function() {
        var node = this;

        // synthesizer (say prompt) + recognizer editor components (with legacy migration)
        var synthVal = {};
        try { if (node.saySynth) synthVal = JSON.parse(node.saySynth) || {}; } catch (e) { synthVal = {}; }
        if ((!synthVal || !synthVal.vendor) && node.speechMigrated !== '1' && node.vendor && node.vendor !== 'default') {
          synthVal = { vendor: node.vendor };
          if (node.lang && node.lang !== 'default') synthVal.language = node.lang;
          if (node.voice && node.voice !== 'default') synthVal.voice = node.voice;
        }
        node._synthHandle = JambonzSpeech.mountSynthesizer(
          document.getElementById('node-input-synth-mount'), { value: synthVal, serverId: node.speechServer });

        var recVal = {};
        try { if (node.recognizer) recVal = JSON.parse(node.recognizer) || {}; } catch (e) { recVal = {}; }
        if ((!recVal || !recVal.vendor) && node.speechMigrated !== '1' && node.transcriptionvendor && node.transcriptionvendor !== 'default') {
          recVal = { vendor: node.transcriptionvendor };
          if (node.recognizerlang && node.recognizerlang !== 'default') recVal.language = node.recognizerlang;
        }
        node._recHandle = JambonzSpeech.mountRecognizer(
          document.getElementById('node-input-rec-mount'), { value: recVal, serverId: node.speechServer });

        $('#node-input-actionhook').typedInput({
          types: ['str', 'msg', 'flow', 'global', 'jsonata', 'env', mustacheType],
          typeField: $('#node-input-actionhookType')
        });
        $('#node-input-partialresulthook').typedInput({
          types: ['str', 'msg', 'flow', 'global', 'jsonata', 'env', mustacheType],
          typeField: $('#node-input-partialresulthookType')
        });
        $('#node-input-playurl').typedInput({
          types: ['str', 'msg', 'flow', 'global', 'jsonata', 'env', mustacheType],
          typeField: $('#node-input-playurlType')
        });
        $('#node-input-transcriptionhints').typedInput({
          types: ['str', 'msg', 'flow', 'global', 'jsonata', 'env', mustacheType],
          typeField: $('#node-input-transcriptionhintsType')
        });
        $('#node-input-recognizeraltlang').typedInput({
          types: ['str', 'msg', 'flow', 'global', 'jsonata', 'env', mustacheType],
          typeField: $('#node-recognizeraltlangType')
        });
        $('#node-input-naics').typedInput({
          types: ['num', 'msg', 'flow', 'global', 'jsonata', 'env', mustacheType],
          typeField: $('#node-input-naicsType')
        });
        $('#node-input-fillerNoise').typedInput({
          types: ['json', 'msg', 'flow', 'global', 'jsonata', 'env'],
          typeField: $('#node-input-fillerNoiseType')
        });
        $('#node-input-vad').typedInput({
          types: ['json', 'msg', 'flow', 'global', 'jsonata', 'env'],
          typeField: $('#node-input-vadType')
        });
        $('#node-input-actionHookDelayAction').typedInput({
          types: ['json', 'msg', 'flow', 'global', 'jsonata', 'env'],
          typeField: $('#node-input-actionHookDelayActionType')
        });

        var enableSpeech = function(enabled) {
          if (enabled) $('#speech-input-container').show();
          else $('#speech-input-container').hide();
        }
        var enableDtmf = function(enabled) {
          if (enabled) $('#dtmf-input-container').show();
          else $('#dtmf-input-container').hide();          
        }

        $('#node-input-speechinput').change(function() {
          var doSpeech = $('#node-input-speechinput:checked').val();
          enableSpeech(doSpeech);
        });
        $('#node-input-dtmfinput').change(function() {
          var doDtmf = $('#node-input-dtmfinput:checked').val();
          enableDtmf(doDtmf);
        });

        var onSayPlayChanged = function () {
          var type = $('#node-input-prompttype').find(':selected').val();
          console.log(`prompt type changed to ${type}`);
          if (type === 'say') {
            $('#say-container').show();
            $('#play-container').hide();
          }
          else {
            $('#play-container').show();
            $('#say-container').hide();
          }
        }
        
        $('#node-input-prompttype').change(onSayPlayChanged);
      },
      oneditsave: function() {
        var s = this._synthHandle ? this._synthHandle.collect() : undefined;
        var r = this._recHandle ? this._recHandle.collect() : undefined;
        $('#node-input-saySynth').val(s ? JSON.stringify(s) : '');
        $('#node-input-recognizer').val(r ? JSON.stringify(r) : '');
        $('#node-input-speechMigrated').val('1');
      }
  });
</script>

<!-- HTML -->
<script type="text/html" data-template-name="gather">
    <div class="form-row">
      <label for="node-input-name"><i class="icon-tag"></i> Name</label>
      <input type="text" id="node-input-name" placeholder="Name">
  </div>
  <div class="form-row">
    <label for="node-input-actionhook"><i class="icon-tag"></i> Action hook</label>
    <input type="text" id="node-input-actionhook" placeholder="webhook with results of gather">
    <input type="hidden" id="node-input-actionhookType">
  </div>
  <div class="form-row">
    <label for="node-input-partialresulthook"><i class="icon-tag"></i> Partial result hook</label>
    <input type="text" id="node-input-partialresulthook" placeholder="webhook with interim transcription results of gather">
    <input type="hidden" id="node-input-partialresulthookType">
  </div>
  <fieldset>
    <legend>Prompt</legend>
    <div class="form-row">
      <label for="node-input-prompttype"><i class="icon-tag"></i> Verb</label>
      <select id="node-input-prompttype">
        <option>play</option>
        <option selected>say</option>
      </select>
    </div>
  
    <div id="say-container">
      <div class="form-row">
        <label for="node-input-text"><i class="icon-tag"></i> Text</label>
        <textarea id="node-input-text" rows="4" placeholder="Text or SSML to speak" style="width:70%"></textarea>
      </div>
      <div class="form-row">
        <label for="node-input-speechServer">Speech data</label>
        <input type="text" id="node-input-speechServer">
        <small style="display:block;margin-left:160px;color:#888;">optional override &mdash; jambonz server for live language/voice lists (auto-detected; falls back to bundled data)</small>
      </div>
      <div id="node-input-synth-mount"></div>
      <input type="hidden" id="node-input-saySynth">
    </div>
  
    <div id="play-container">
      <div class="form-row">
        <label for="node-input-playurl"> Url</label>
        <input type="text" id="node-input-playurl" placeholder="url of file to play">
        <input type="hidden" id="node-input-playurlType">
      </div>
      <div class="form-row">
        <label for="node-input-playLoop"> Loop</label>
        <input type="text" id="node-input-playLoop" placeholder="count">
      </div>
    </div>
  </fieldset>
  <fieldset>
    <legend>DTMF Input</legend>
    <div class="form-row">
      <label for="node-input-dtmfinput">Accept DTMF input</label>
      <input type="checkbox" id="node-input-dtmfinput">
    </div>
    <div id="dtmf-input-container">
      <div class="form-row">
        <label for="node-input-dtmfbargein">Allow DTMF bargein</label>
        <input type="checkbox" id="node-input-dtmfbargein">
      </div>
      <div class="form-row">
        <label for="node-input-finishonkey"><i class="icon-tag"></i> Finish key</label>
        <input type="text" id="node-input-finishonkey" placeholder="dtmf key to signal end of input">
      </div>
      <div class="form-row">
        <label for="node-input-numdigits"><i class="icon-tag"></i> Num. digits</label>
        <input type="text" id="node-input-numdigits" placeholder="number of digits to collect">
      </div>
      <div class="form-row">
        <label for="node-input-mindigits"><i class="icon-tag"></i> Min. digits</label>
        <input type="text" id="node-input-mindigits" placeholder="Minimum number of dtmf digits expected to gather">
      </div>
      <div class="form-row">
        <label for="node-input-maxdigits"><i class="icon-tag"></i> Max. digits</label>
        <input type="text" id="node-input-maxdigits" placeholder="Maximum number of dtmf digits expected to gather">
      </div>
      <div class="form-row">
        <label for="node-input-interdigittimeout"><i class="icon-tag"></i> Inter digit timeout</label>
        <input type="text" id="node-input-interdigittimeout" placeholder="Amount of time to wait between digits after minDigits have been entered">
      </div>
      <div class="form-row">
        <label for="node-input-numtimeout"><i class="icon-tag"></i> Timeout</label>
        <input type="text" id="node-input-timeout" placeholder="dtmf timeout in secs">
      </div>
    </div>
  </fieldset>
  <fieldset>
    <legend>Speech Input</legend>
    <div class="form-row">
      <label for="node-input-speechinput">Accept Speech input</label>
      <input type="checkbox" id="node-input-speechinput">
    </div>
    <div id="speech-input-container">
      <div class="form-row">
        <label for="node-input-bargein">Allow Speech bargein</label>
        <input type="checkbox" id="node-input-bargein">
      </div>
      <div class="form-row">
        <label for="node-input-listenduringprompt">Listen during prompt</label>
        <input type="checkbox" id="node-input-listenduringprompt">
      </div>
      <div id="node-input-rec-mount"></div>
      <input type="hidden" id="node-input-recognizer">
      <input type="hidden" id="node-input-speechMigrated">
    </div>
  </fieldset>
  <fieldset>
    <legend>Advanced</legend>
    <div class="form-row">
      <label for="node-input-fillerNoise">Filler noise</label>
      <input type="text" id="node-input-fillerNoise" placeholder='{"enable":true,"url":"..."}'>
      <input type="hidden" id="node-input-fillerNoiseType">
    </div>
    <div class="form-row">
      <label for="node-input-vad">VAD</label>
      <input type="text" id="node-input-vad" placeholder='{"enable":true}'>
      <input type="hidden" id="node-input-vadType">
    </div>
    <div class="form-row">
      <label for="node-input-actionHookDelayAction">Action hook delay</label>
      <input type="text" id="node-input-actionHookDelayAction" placeholder='{"enabled":true,"actions":[...]}'>
      <input type="hidden" id="node-input-actionHookDelayActionType">
    </div>
  </fieldset>
</script>

<!-- Help Text -->
<script type="text/html" data-help-name="gather">
    <p>Collect speech or dtmf input from the caller</p>
    <h3>Inputs</h3>
    <dl class="message-properties">
      <dt>Action hook<span class="property-type">string</span></dt>
      <dd>A webhook invoke when operation completes.</dd>
      <dt>Speech<span class="property-type">boolean</span></dt>
      <dd>Enable speech input.</dd>
      <dt>Digits<span class="property-type">boolean</span></dt>
      <dd>Enable DTMF input.</dd>
      <dt>Language<span class="property-type">string</span></dt>
      <dd>Language to use for speech recognition</dd>
      <dt>Hints<span class="property-type">string</span></dt>
      <dd>Comma-separate list of words or phrases to assist speech detection</dd>
      <dt>Verb<span class="property-type">string</span></dt>
      <dd>Whether to use the play or say verb to prompt the caller</dd>
      <dt>Url<span class="property-type">string</span></dt>
      <dd>Url of prompt to play</dd>
      <dt>Text<span class="property-type">string</span></dt>
      <dd>Text to speak as a prompt to caller</dd>
      <dt>Vendor<span class="property-type">string</span></dt>
      <dd>TTS vendor</dd>
      <dt>Language<span class="property-type">string</span></dt>
      <dd>TTS language</dd>
      <dt>Voice<span class="property-type">string</span></dt>
      <dd>TTS voice</dd>
    </dl>
  
    <h3>Outputs</h3>
    <dl class="message-properties">
      <dt>jambonz<span class="property-type">object</span></dt>
      <dd> <code>msg.jambonz</code> will contain any previous actions provided to the input with the new <code>gather</code> action appended  </dd>
    </dl>
  
    <h3>Details</h3>
    The gather command is used to collect dtmf or speech input.

    Within the text field you can use mustache syntax to insert properties of the msg, flow or global objects.
    For example if you wanted to insert the value of msg.payload into the text you could put
    <code>The payload is {{msg.payload}}</code>
    <h3>References</h3>
      <ul>
          <li><a href="https://docs.jambonz.org/verbs/verbs/gather">Jambonz gather reference</a></li>
      </ul>
</script>
