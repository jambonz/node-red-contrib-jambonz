<!-- Javascript -->
<script type="text/javascript">
  RED.nodes.registerType('get_conferences', {
    category: 'jambonz',
    color: '#aebfb9',
    defaults: {
      name: {value: ''},
      server: {value: '', required: true, type: 'jambonz_auth'},
      expand: {value: false}
    },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-users",
    paletteLabel: "Get - Conferences",
    label: function() { return this.name || 'Get Conferences'; }
  });
</script>

<!-- HTML -->
<script type="text/html" data-template-name="get_conferences">
  <div class="form-row">
    <label for="node-input-name"><i class="icon-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name">
  </div>
  <div class="form-row">
    <label for="node-input-server">Server</label>
    <input type="text" id="node-input-server">
  </div>
  <div class="form-row">
    <label for="node-input-expand">Include participants</label>
    <input type="checkbox" id="node-input-expand">
  </div>
</script>

<!-- Help Text -->
<script type="text/html" data-help-name="get_conferences">
  <p>List the active conferences under the account.</p>
  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>Include participants<span class="property-type">boolean</span></dt>
    <dd>if checked, expand each conference to include its live participants and durations
      (<code>?expand=participants</code>).</dd>
  </dl>
  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload<span class="property-type">array</span></dt>
    <dd><code>msg.payload</code> will contain the list of conferences.</dd>
  </dl>
</script>
