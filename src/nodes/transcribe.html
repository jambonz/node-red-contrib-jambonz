<!-- Javascript -->
<script type="text/javascript">
  RED.nodes.registerType('transcribe', {
    category: 'jambonz',
    color: '#bbabaa',
    defaults: {
      name: {value: ''},
      transcriptionHook: {value: '', required: true},
      transcriptionHookType: {value: 'str'},
      translationHook: {value: ''},
      translationHookType: {value: 'str'},
      vendor: {value: 'default'},
      language: {value: 'default'},
      recognizerOptions: {value: ''},
      recognizerOptionsType: {value: 'json'},
      channel: {value: 'default'},
      earlyMedia: {value: false}
    },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-file-text-o",
    paletteLabel: "transcribe",
    label: function() { return this.name || 'transcribe'; },
    oneditprepare: function() {
      var hookTypes = ['str', 'msg', 'flow', 'global', 'jsonata', 'env'];
      $('#node-input-transcriptionHook').typedInput({types: hookTypes, typeField: $('#node-input-transcriptionHookType')});
      $('#node-input-translationHook').typedInput({types: hookTypes, typeField: $('#node-input-translationHookType')});
      $('#node-input-recognizerOptions').typedInput({types: ['json', 'msg', 'flow', 'global', 'jsonata', 'env'], typeField: $('#node-input-recognizerOptionsType')});
    }
  });
</script>

<!-- HTML -->
<script type="text/html" data-template-name="transcribe">
  <div class="form-row">
    <label for="node-input-name"><i class="icon-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name">
  </div>
  <div class="form-row">
    <label for="node-input-transcriptionHook">Transcription hook</label>
    <input type="text" id="node-input-transcriptionHook" placeholder="url">
    <input type="hidden" id="node-input-transcriptionHookType">
  </div>
  <div class="form-row">
    <label for="node-input-translationHook">Translation hook</label>
    <input type="text" id="node-input-translationHook" placeholder="url (optional)">
    <input type="hidden" id="node-input-translationHookType">
  </div>
  <fieldset>
    <legend>Recognizer</legend>
    <div class="form-row">
      <label for="node-input-vendor">Vendor</label>
      <select id="node-input-vendor">
        <option value="default">--application default--</option>
        <option value="google">google</option>
        <option value="aws">aws</option>
        <option value="deepgram">deepgram</option>
        <option value="microsoft">microsoft</option>
        <option value="ibm">ibm</option>
        <option value="nuance">nuance</option>
        <option value="soniox">soniox</option>
        <option value="assemblyai">assemblyai</option>
        <option value="speechmatics">speechmatics</option>
        <option value="gladia">gladia</option>
        <option value="nvidia">nvidia</option>
      </select>
    </div>
    <div class="form-row">
      <label for="node-input-language">Language</label>
      <input type="text" id="node-input-language" placeholder="e.g. en-US (or leave as default)">
    </div>
    <div class="form-row">
      <label for="node-input-recognizerOptions">Options</label>
      <input type="text" id="node-input-recognizerOptions" placeholder='advanced recognizer options object'>
      <input type="hidden" id="node-input-recognizerOptionsType">
    </div>
  </fieldset>
  <fieldset>
    <legend>Advanced</legend>
    <div class="form-row">
      <label for="node-input-channel">Channel</label>
      <select id="node-input-channel">
        <option value="default">--both / default--</option>
        <option value="1">1</option>
        <option value="2">2</option>
      </select>
    </div>
    <div class="form-row">
      <label for="node-input-earlyMedia" style="width:auto">Early media</label>
      <input type="checkbox" id="node-input-earlyMedia" style="display:inline-block; width:auto; vertical-align:top;">
    </div>
  </fieldset>
</script>

<!-- Help Text -->
<script type="text/html" data-help-name="transcribe">
  <p>Transcribe the call in real time and POST results to a webhook, without otherwise affecting the call.</p>
  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>Transcription hook<span class="property-type">string</span></dt>
    <dd>required. URL that receives transcription results.</dd>
    <dt>Translation hook<span class="property-type">string</span></dt>
    <dd>optional URL that receives translated transcripts.</dd>
    <dt>Vendor / Language<span class="property-type">string</span></dt>
    <dd>speech recognizer vendor and language. Leave as default to use the application/session recognizer.</dd>
    <dt>Options<span class="property-type">json</span></dt>
    <dd>advanced recognizer options (hints, per-vendor option blocks, diarization, etc.) merged into the recognizer.</dd>
    <dt>Channel<span class="property-type">number</span></dt>
    <dd>restrict transcription to one channel of a stereo call.</dd>
  </dl>
  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>jambonz<span class="property-type">object</span></dt>
    <dd><code>msg.jambonz</code> will contain any previous actions with the new <code>transcribe</code> action appended.</dd>
  </dl>
  <h3>Details</h3>
  The transcribe verb starts real-time transcription that runs alongside the call. It differs from
  <code>gather</code> (which collects a single caller response) and from a <code>listen</code> fork (which
  streams audio to a websocket): transcribe simply delivers transcripts to your hook.
  <h3>References</h3>
  <ul>
    <li><a href="https://docs.jambonz.org/verbs/verbs/transcribe">Jambonz transcribe reference</a></li>
  </ul>
</script>
